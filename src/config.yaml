site:
  name: Jonathan Root
  site: 'https://design-portfolio-jaroot32.vercel.app'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata
metadata:
  title:
    default: Jonathan Root — Learning Experience Designer
    template: '%s — Jonathan Root'
  description: 'Learning Experience Designer with 8+ years building scalable, interactive learning for software developers and eLearning professionals.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Jonathan Root
    images:
      - url: '~/assets/images/default.png'
        width: 1600
        height: 600
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: 'G-CYC14ZJDKG'

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
